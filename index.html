<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>It's A Small World Recipe</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <h1>It's A Small World Recipe</h1>

  <!-- FILTERS + SEARCH + MUSIC TOGGLE -->
  <section class="controls">
    <label for="continentSelect"><strong>Filter by continent:</strong></label>
    <select id="continentSelect">
      <option value="All">All</option>
      <option value="Africa">Africa</option>
      <option value="Asia">Asia</option>
      <option value="Europe">Europe</option>
      <option value="North America">North America</option>
      <option value="South America">South America</option>
      <option value="Oceania">Oceania</option>
    </select>

    <label for="searchInput"><strong>Search recipe:</strong></label>
    <input id="searchInput" type="text" placeholder="Type recipe name..." />

    <!-- Dedicated Music Button -->
    <button id="musicToggleBtn" type="button" style="margin-left: 10px; cursor: pointer;">
      Play Music
    </button>
  </section>

  <!-- MAIN LAYOUT -->
  <main class="layout">
    <!-- RECIPE LIST -->
    <section class="recipe-list">
      <h2>Recipes</h2>
      <ul id="recipeList"></ul>
    </section>

    <!-- RECIPE DETAILS -->
    <section class="recipe-details">
      <h2>Details</h2>
      <div id="recipeDetails">
        <p>Select a recipe to see details.</p>
      </div>
    </section>

    <!-- SAVED RECIPES -->
    <section class="saved-recipes">
      <h2>Saved Recipes</h2>
      <ul id="savedList"></ul>
    </section>
  </main>

  <!-- BACKGROUND MUSIC -->
  <audio id="bgMusic" loop preload="auto">
    <source src="assets/its_a_small_world.mp3" type="audio/mpeg">
  </audio>

  <!-- SCRIPTS -->
  <script src="data.js"></script>
  <script src="script.js"></script>

  <!-- AUDIO CONTROL SCRIPT -->
  <script>
    const musicBtn = document.getElementById("musicToggleBtn");
    const bgMusic = document.getElementById("bgMusic");

    musicBtn.addEventListener("click", () => {
      if (bgMusic.paused) {
        bgMusic.play()
          .then(() => {
            musicBtn.textContent = "Pause Music";
          })
          .catch((err) => {
            console.error("Audio playback error:", err);
            alert("Could not load audio. Check that assets/its_a_small_world.mp3 exists.");
          });
      } else {
        bgMusic.pause();
        musicBtn.textContent = "Play Music";
      }
    });
  </script>

</body>
</html>
